name: CI

on:
  push:
    branches: [main, master, modernizacion]
  pull_request:
    branches: [main, master]

jobs:
  pruebas:
    name: Pruebas y estilo
    runs-on: ubuntu-latest

    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Preparar PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, intl, bcmath, sqlite3, pdo_sqlite
          coverage: xdebug

      - name: Cachear dependencias de Composer
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      - name: Instalar dependencias
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Preparar el entorno
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Revisar estilo de codigo
        run: vendor/bin/pint --test

      - name: Ejecutar la suite de pruebas
        run: php artisan test --coverage --min=70
        env:
          # SQLite en memoria: la CI no necesita credenciales de Azure.
          DB_CONNECTION: testing

  # Despliegue continuo: cada push a main que pasa pruebas y estilo llega
  # solo a produccion, sin construir ni subir la imagen a mano. La imagen
  # se publica en GitHub Container Registry (gratis para paquetes publicos):
  # el registro de Azure (ACR) cobraba aunque no se usara.
  desplegar:
    name: Desplegar en Azure Container Apps
    needs: pruebas
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: produccion
      cancel-in-progress: false

    # OIDC: GitHub obtiene un token temporal de Azure en cada ejecucion.
    # No hay contrasena ni secreto de larga duracion guardado en el repo.
    permissions:
      id-token: write
      contents: read
      packages: write

    env:
      IMAGEN: ghcr.io/lariasca1994/reservas-corferias
      APP: reservas-corferias
      GRUPO: PersonalEAN

    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Iniciar sesion en GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Etiqueta por commit (y no solo :latest) para que la Container App
      # detecte el cambio y cree una revision nueva; ademas permite volver
      # a una version anterior sabiendo exactamente que codigo tenia.
      - name: Construir y publicar la imagen
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGEN }}:${{ github.sha }}
            ${{ env.IMAGEN }}:latest

      # La Container App descarga la imagen sin credenciales: si el paquete
      # quedara privado, la nueva revision no arrancaria. Se corta aqui y la
      # demo sigue con la version anterior.
      - name: Verificar que la imagen es publica
        run: |
          docker logout ghcr.io
          docker manifest inspect "$IMAGEN:${{ github.sha }}" > /dev/null || {
            echo "::error::El paquete $IMAGEN es privado. Hacerlo publico en GitHub (Package settings > Change visibility) y relanzar."
            exit 1
          }

      - name: Iniciar sesion en Azure
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Actualizar la Container App
        run: |
          az extension add --name containerapp --upgrade --only-show-errors
          az containerapp update             --name "$APP"             --resource-group "$GRUPO"             --image "$IMAGEN:${{ github.sha }}"             --only-show-errors             --query "properties.latestRevisionName" -o tsv
