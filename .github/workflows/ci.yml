name: CI

on:
  push:
    branches: [main, master, modernizacion]
  pull_request:
    branches: [main, master]

jobs:
  pruebas:
    name: Pruebas y estilo
    runs-on: ubuntu-latest

    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Preparar PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, intl, bcmath, sqlite3, pdo_sqlite
          coverage: xdebug

      - name: Cachear dependencias de Composer
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      - name: Instalar dependencias
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Preparar el entorno
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Revisar estilo de codigo
        run: vendor/bin/pint --test

      - name: Ejecutar la suite de pruebas
        run: php artisan test --coverage --min=70
        env:
          # SQLite en memoria: la CI no necesita credenciales de Azure.
          DB_CONNECTION: testing

  # Despliegue continuo: cada push a main que pasa pruebas y estilo llega
  # solo a produccion, sin construir ni subir la imagen a mano. La imagen
  # se construye dentro del propio ACR (az acr build), asi el runner no
  # necesita Docker ni credenciales del registro.
  desplegar:
    name: Desplegar en Azure Container Apps
    needs: pruebas
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: produccion
      cancel-in-progress: false

    # OIDC: GitHub obtiene un token temporal de Azure en cada ejecucion.
    # No hay contrasena ni secreto de larga duracion guardado en el repo.
    permissions:
      id-token: write
      contents: read

    env:
      REGISTRO: ca5866f8d77facr
      IMAGEN: reservas-corferias
      APP: reservas-corferias
      GRUPO: PersonalEAN

    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Iniciar sesion en Azure
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      # Etiqueta por commit (y no solo :latest) para que la Container App
      # detecte el cambio y cree una revision nueva; ademas permite volver
      # a una version anterior sabiendo exactamente que codigo tenia.
      - name: Construir la imagen en ACR
        run: |
          az acr build \
            --registry "$REGISTRO" \
            --image "$IMAGEN:${{ github.sha }}" \
            --image "$IMAGEN:latest" \
            .

      - name: Actualizar la Container App
        run: |
          az extension add --name containerapp --upgrade --only-show-errors
          az containerapp update \
            --name "$APP" \
            --resource-group "$GRUPO" \
            --image "$REGISTRO.azurecr.io/$IMAGEN:${{ github.sha }}" \
            --only-show-errors \
            --query "properties.latestRevisionName" -o tsv
